services:
  - type: web
    name: coachxai-server
    env: node
    rootDir: server
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres, "Session pooler" connection string (Supabase
      # dashboard → Connect → Session pooler):
      #   postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres
      # Not the direct db.<ref>.supabase.co host (IPv6 only) and not the
      # transaction pooler on :6543. See docs/SUPABASE_DB.md.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Admin console credentials (POST /api/auth/login/admin). Set
      # ADMIN_PASSWORD_HASH (bcrypt) in preference to ADMIN_PASSWORD. When
      # neither is set the server falls back to the legacy built-in pair
      # that used to be hardcoded in the frontend bundle.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: PAYAPP_SECRET_KEY
        sync: false
      - key: PAYAPP_API_BASE
        sync: false
      - key: PAYAPP_CHECKOUT_URL
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

